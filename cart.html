<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — PERAN</title>
  <meta name="description" content="Your PERAN cart.">
  <meta name="theme-color" content="#6e1d1c">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-bar">
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
        <span class="sr-only">Menu</span>
        <span class="burger" aria-hidden="true"></span>
      </button>
      <a class="wordmark" href="index.html">
        <span class="wordmark-name">PERAN</span>
        <span class="wordmark-sub">The Wedding House</span>
      </a>
      <nav id="site-nav" class="site-nav" data-nav aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="cart-link" href="cart.html" data-cart-link aria-current="page">Cart <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </header>
  <main id="main" class="wrap">
    <div class="page-head">
      <p class="eyebrow">Bag</p>
      <h1>Cart</h1>
    </div>
    <p class="empty" data-cart-empty>Your cart is empty. <a href="shop.html">Shop the rail</a>.</p>
    <ul class="cart-list" data-cart-list></ul>
    <div class="summary-bar" data-cart-summary hidden>
      <p class="subtotal"><span>Subtotal</span> <span data-subtotal>₹0</span></p>
      <a class="btn btn-solid" href="checkout.html">Checkout</a>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-grid">
      <p>Prototype shop. The cart stays in this browser only.</p>
    </div>
  </footer>
  <script src="js/catalog.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cart-page.js"></script>
</body>
</html>
